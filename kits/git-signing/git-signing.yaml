# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: mixin
displayName: Git signing
description: Your git identity, and commits signed with a key from your SSH agent.
# x-release-please-start-version
version: "0.42.0"
# x-release-please-end
provides: [git-signing]

args:
  # The public key to sign with, as `ssh-add -L` prints it (the comment is optional, and git's
  # `key::` in front is fine). Not a path to a key file. Empty signs with the agent's
  # first key.
  signingKey:
    default: ""
    # Nothing that could leave the single quotes the install step puts it in.
    pattern: '^[A-Za-z0-9@.+/=: -]*$'

capabilities:
  # user.name and user.email, from the host's git.
  - type: com.docker.sandbox/git-identity@1

  # The host's SSH agent, for git signatures and nothing else. Optional, so a host without an
  # agent still creates the sandbox; the script below then says why a commit can't be signed.
  - type: com.docker.sandbox/ssh-agent@1
    optional: true
    config:
      phase: runtime
      unrestricted: false
      sign: [git]

  - type: com.docker.sandbox/lifecycle@1
    config:
      files:
        # git runs this for each signature (gpg.ssh.defaultKeyCommand) and signs with the key it
        # prints.
        - path: /etc/git-signing/pick-key
          mode: "0755"
          overwrite: true
          content: |
            #!/bin/sh
            # Prints the public key git signs with, as `key::<type> <key>`, and records it as a
            # trusted signer for the committer so `git log --show-signature` can verify it.
            dir=/etc/git-signing

            refuse() {
              {
                echo "git-signing: $1"
                shift
                for line in "$@"; do echo "  $line"; done
                echo "  git may add \"user.signingKey needs to be set\" below. Ignore that: the key"
                echo "  comes from the SSH agent, and setting user.signingKey here won't help."
              } >&2
              exit 1
            }

            [ -n "${SSH_AUTH_SOCK:-}" ] || refuse \
              "no SSH agent reaches this sandbox (SSH_AUTH_SOCK is unset), so there is no key to sign with." \
              "On the host, check that 'ssh-add -l' lists a key and that" \
              "'bento settings get ssh.agentForwardingEnabled' prints true, then create the sandbox" \
              "again: the agent is attached when a sandbox is created."

            keys=$(ssh-add -L 2>/dev/null)
            case $? in
              0) ;;
              1) refuse "the SSH agent holds no keys." \
                   "On the host, add one with 'ssh-add <private key file>' (or unlock your key manager)." \
                   "The sandbox sees it at once; nothing needs restarting." ;;
              127) refuse "ssh-add isn't installed in this sandbox." \
                     "Install the OpenSSH client (ssh-add and ssh-keygen) in the image." ;;
              *) refuse "the SSH agent at $SSH_AUTH_SOCK isn't answering." \
                   "On the host, check that your agent runs ('ssh-add -l') and run 'bento diagnose'," \
                   "which checks the service that forwards it to this sandbox." ;;
            esac

            # The agent's key that has this base64 body, without its comment.
            held() {
              printf '%s\n' "$keys" | awk -v want="$1" '$2 == want { print $1 " " $2; exit }'
            }

            pinned=$(sed 's/^key:://' "$dir/key" 2>/dev/null)
            if [ -n "$pinned" ]; then
              # With or without the key type in front.
              body=$(printf '%s\n' "$pinned" | awk '{ print (NF > 1 ? $2 : $1) }')
              # Every SSH public key's base64 starts this way; a file path or a GPG key id doesn't.
              case $body in
                AAAA*) ;;
                *) refuse "the key this sandbox was told to sign with (signingKey) isn't a public key:" \
                     "$pinned" \
                     "Create the sandbox again with the key itself, a line of 'ssh-add -L' on the host:" \
                     "--kit-arg \"signingKey=ssh-ed25519 AAAA...\"" ;;
              esac
              key=$(held "$body")
              [ -n "$key" ] || refuse \
                "the SSH agent doesn't hold the key this sandbox was told to sign with (signingKey):" \
                "$pinned" \
                "On the host, add that key to your agent ('ssh-add -L' lists what it holds), or create" \
                "the sandbox again with another --kit-arg signingKey=..."
            else
              key=$(held "$(printf '%s\n' "$keys" | awk 'NR == 1 { print $2 }')")
              [ -n "$key" ] || refuse "the SSH agent listed no usable key." \
                "On the host, 'ssh-add -L' should print at least one public key."
            fi

            email=$(git var GIT_COMMITTER_IDENT 2>/dev/null | sed -n 's/.*<\(.*\)>.*/\1/p')
            signers=$HOME/.config/git-signing/allowed_signers
            if [ -n "$email" ] && mkdir -p "${signers%/*}" 2>/dev/null; then
              entry="$email namespaces=\"git\" $key"
              grep -qxF "$entry" "$signers" 2>/dev/null || echo "$entry" >> "$signers"
            fi

            echo "key::$key"

      install:
        # System config: your own git config, and a repository's, still win.
        - command: |
            set -e
            dir=/etc/git-signing
            mkdir -p "$dir"
            key='${{ kit.args.signingKey }}'
            if [ -n "$key" ]; then echo "$key" > "$dir/key"; else rm -f "$dir/key"; fi
            # Commits only: with tag signing on, a plain `git tag v1` would ask for a message.
            printf '[commit]\n\tgpgSign = true\n' > "$dir/sign.gitconfig"
            git config --system gpg.format ssh
            git config --system gpg.ssh.defaultKeyCommand "$dir/pick-key"
            git config --system gpg.ssh.allowedSignersFile '~/.config/git-signing/allowed_signers'
            # Sign only in repositories with a remote: a scratch `git init` stays unsigned. git
            # before 2.36 doesn't know the condition and signs nothing.
            git config --system 'includeIf.hasconfig:remote.*.url:**.path' "$dir/sign.gitconfig"
          user: "0"
          description: Sign commits with a key from the SSH agent

  # One version is used per sandbox, whichever its other kits offer.
  - type: com.docker.sandbox/agent-context@1
    optional: true
    config:
      content: &note >-
        Commits in repositories with a remote are signed automatically with the user's SSH key;
        sign a tag with `git tag -s`. Don't change the signing config or pass `--no-gpg-sign`: if
        signing fails, show the user the message. The SSH agent here may allow git signatures
        only, so if git over SSH is refused, use an HTTPS remote. A signature says the commit came
        from this sandbox, not that the user reviewed it.
  - type: com.docker.sandbox/agent-context@2
    optional: true
    config:
      content: *note
