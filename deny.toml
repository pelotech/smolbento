[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Unmaintained, not vulnerable, and no fixed version exists. Drop each entry when its crate is gone.
ignore = [
  # chrono comes with oci-client and russh-util; neither has a release without it yet.
  { id = "RUSTSEC-2026-0543", reason = "transitive (oci-client, russh-util); no upgrade available" },
  # humantime is flagged only because it wraps chrono. Ours to replace (jiff or time).
  { id = "RUSTSEC-2026-0542", reason = "flagged for wrapping chrono; replace with jiff or time" },
  # rustls-pemfile comes with smolvm-credentials' reqwest 0.12; drops out when it moves to reqwest 0.13.
  { id = "RUSTSEC-2025-0134", reason = "transitive (smolvm-credentials via reqwest 0.12); no upgrade available" },
]

[licenses]
version = 2
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "MPL-2.0",
  "CDLA-Permissive-2.0", # webpki-root-certs, pulled in by rustls-platform-verifier (non-host targets)
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# Temporary: russh from git until a release pins ssh-key 0.7.0-rc.12+; then drop this, the flake outputHashes, and use crates.io.
# Temporary: smolvm-credentials and smolvm-protocol from a fork branch (smolvm plus an https .gitmodules) until smolvm-credentials is on crates.io.
allow-git = ["https://github.com/Eugeny/russh", "https://github.com/josmo/smolvm"]
