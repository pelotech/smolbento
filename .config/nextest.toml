# The e2e tests that build a local kit (those taking a `BuilderGuard`) share smolbento's one
# `_builder` sandbox: a build recreates it when its stored registry logins differ, and a guard
# deletes it after its test. So they run one at a time. Every profile inherits this.
[test-groups]
builder = { max-threads = 1 }

[[profile.default.overrides]]
filter = '''binary(e2e) & (
    test(local_v3_kit_builds_in_the_builder_sandbox)
    | test(local_kit_builds_from_a_registry_that_needs_a_login)
    | test(nix_kit_gives_agents_nix_and_direnv)
    | test(nix_kit_works_for_a_workload_image_user)
    | test(capability_groups_apply_whole_or_not_at_all)
    | test(kit_args_reach_typed_config_fields)
)'''
test-group = 'builder'

# CI's e2e job runs with NEXTEST_PROFILE=ci. Several e2e tests reach example.com and httpbin.org,
# so a failed e2e test gets one retry there; nextest still reports it as flaky.
[profile.ci]
fail-fast = false

# A test that hangs is stopped after 5 minutes (the slowest pass in about 2), and nextest prints
# what it wrote, instead of the job's timeout cancelling the whole shard with nothing to show.
[[profile.ci.overrides]]
filter = 'binary(e2e)'
retries = 1
slow-timeout = { period = "60s", terminate-after = 10 }
