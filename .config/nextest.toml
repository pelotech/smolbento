# The e2e tests that build a local kit share smolbento's one `_builder` sandbox, which stays
# between tests (in the tests' own smolvm home) so BuildKit keeps its cache. The `builder` group runs
# them one at a time within a run: a build stops the builder afterwards when it wasn't running, which
# would stop it under another test's build, and one with other registry logins recreates it. Every
# profile inherits this. On CI, `just e2e-shard` puts the two builder tests (nix, local_v3) on
# different shards, each with its own builder.
[test-groups]
builder = { max-threads = 1 }

[[profile.default.overrides]]
filter = '''binary(e2e) & (
    test(local_v3_kit_builds_in_the_builder_sandbox)
    | test(local_kit_builds_from_a_registry_that_needs_a_login)
    | test(nix_kit_works_for_an_agent_and_a_workload_image_user)
)'''
test-group = 'builder'

# On macOS, smolvm seeds a machine made from a pack (a saved template) with storage it prepares
# in its cache, and with many tests running at once that has failed with "prepare packed image
# storage: No such file or directory". The one test that creates from a template runs alone
# there; Linux has no such seeding.
[[profile.default.overrides]]
platform = 'cfg(target_os = "macos")'
filter = 'binary(e2e) & test(=fork_template::template_round_trip)'
threads-required = 'num-test-threads'

# The slowest e2e tests (`e2e_heavy_*` in the justfile, which deals them to the CI shards) start
# first, so the longest of a shard doesn't start last and run on alone.
[[profile.default.overrides]]
filter = '''binary(e2e) & (
    test(=kits::nix_kit_works_for_an_agent_and_a_workload_image_user)
    | test(=kits::real_claude_kit_binds_its_api_key_and_seeds_its_settings)
    | test(=kits::real_shell_kit_runs_dockerd_across_restarts)
    | test(=kits::local_v3_kit_builds_in_the_builder_sandbox)
    | test(=fork_template::fork_round_trip)
    | test(=basics::clone_round_trip)
)'''
priority = 10

# Several e2e tests reach example.com and httpbin.org, so a failed e2e test gets one retry, locally
# and on CI; nextest still reports it as flaky.
[[profile.default.overrides]]
filter = 'binary(e2e)'
retries = 1

# CI's e2e job runs with NEXTEST_PROFILE=ci.
[profile.ci]
fail-fast = false

# A test that hangs is stopped after 5 minutes (the slowest pass in about 2), and nextest prints
# what it wrote, instead of the job's timeout cancelling the whole shard with nothing to show.
[[profile.ci.overrides]]
filter = 'binary(e2e)'
slow-timeout = { period = "60s", terminate-after = 5 }
