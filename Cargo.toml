[package]
name = "smolbento"
version = "0.1.1"
edition = "2024"
description = "Docker Sandboxes (sbx) compatible agent sandboxes on smolvm microVMs"
license = "Apache-2.0"
repository = "https://github.com/pelotech/smolbento"
authors = ["Pelotech"]

[[bin]]
name = "smolbento"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
humantime = "2.4.0"
libc = "0.2.191"
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "2.0.0"
serde_json = "1.0.154"
thiserror = "2.0.21"
toml = "1.1.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
insta = "1.49.0"
shlex = "2.0.1"
tempfile = "3.27.0"
