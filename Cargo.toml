[package]
name = "smolbento"
version = "0.22.1"
edition = "2024"
description = "Docker Sandboxes (sbx) compatible agent sandboxes on smolvm microVMs"
license = "Apache-2.0"
repository = "https://github.com/pelotech/smolbento"
authors = ["Pelotech"]

[[bin]]
name = "smolbento"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.0"
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
hmac = "0.13.0"
humantime = "2.4.0"
libc = "0.2.191"
oci-client = { version = "0.18.0", default-features = false, features = ["rustls-tls-no-provider"] }
regex-lite = "0.1.9"
# Already in the tree via oci-client; used directly to mint registry pull tokens.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "2.0.0"
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
signature = "3.0.0"
# Pinned exactly while it is a release candidate; Renovate moves it to 0.7.0.
ssh-key = { version = "=0.7.0-rc.12", default-features = false, features = ["std", "ed25519", "p256", "p384", "p521", "rsa"] }
tar = { version = "0.4.46", default-features = false }
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = "1.1.8"
tokio = { version = "1.54.1", features = ["rt"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
insta = "1.49.0"
shlex = "2.0.1"
