[package]
name = "egress-front"
version = "0.37.0"
edition = "2024"
description = "Hosted egress front for smolvm machines, written to be lifted into smolvm"
license = "Apache-2.0"
authors = ["Pelotech"]
publish = false

# Stopgap until smolvm's request-filter hook is released and smolvm-credentials is on crates.io: a tag on the fork
# that is a smolvm base plus the hook (and an https .gitmodules). `just smolvm-fork [BASE]` makes it and updates
# these lines; BASE defaults to the release in smolvm.lock.
[dependencies]
anyhow = "1.0.104"
smolvm-credentials = { git = "https://github.com/josmo/smolvm", tag = "bento-main-c5ae3713-hook0d03d418", version = "1.36.1" }
smolvm-protocol = { git = "https://github.com/josmo/smolvm", tag = "bento-main-c5ae3713-hook0d03d418", version = "1.36.1" }
