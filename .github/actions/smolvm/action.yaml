---
name: smolvm
description: "let the runner user use KVM and install the pinned smolvm (x86_64 Linux)"

runs:
  using: 'composite'
  steps:
    - name: Enable KVM for the runner user
      shell: bash
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    # The pinned smolvm (smolvm.lock), checked against the lock's own checksum.
    - name: Install smolvm
      shell: bash
      # Puts the checksum-verified smolvm directory on PATH.
      run: | # zizmor: ignore[github-env]
        SMOLVM_VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' smolvm.lock)
        sha=$(sed -n 's/^linux-x86_64 = "\(.*\)"/\1/p' smolvm.lock)
        base="https://github.com/smol-machines/smolvm/releases/download/v${SMOLVM_VERSION}"
        tarball="smolvm-${SMOLVM_VERSION}-linux-x86_64.tar.gz"
        cd "$RUNNER_TEMP"
        curl -fsSLO "$base/$tarball"
        echo "${sha}  ${tarball}" | sha256sum -c -
        tar xzf "$tarball"
        echo "$RUNNER_TEMP/smolvm-${SMOLVM_VERSION}-linux-x86_64" >> "$GITHUB_PATH"

    - name: smolvm version
      shell: bash
      run: smolvm --version
