---
name: smolvm
description: "let the runner user use KVM and install the pinned smolvm (x86_64 Linux)"

runs:
  using: 'composite'
  steps:
    - name: Enable KVM for the runner user
      shell: bash
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    # The one smolvm version CI uses; Renovate bumps it here.
    - name: Install smolvm
      shell: bash
      env:
        SMOLVM_VERSION: "1.35.0"
      run: |
        base="https://github.com/smol-machines/smolvm/releases/download/v${SMOLVM_VERSION}"
        tarball="smolvm-${SMOLVM_VERSION}-linux-x86_64.tar.gz"
        cd "$RUNNER_TEMP"
        curl -fsSLO "$base/$tarball"
        curl -fsSL "$base/checksums.sha256" | grep " ${tarball}\$" | sha256sum -c -
        tar xzf "$tarball"
        echo "$RUNNER_TEMP/smolvm-${SMOLVM_VERSION}-linux-x86_64" >> "$GITHUB_PATH" # zizmor: ignore[github-env]

    - name: smolvm version
      shell: bash
      run: smolvm --version
