name: Release Please
on:
  push:
    branches:
      - main

permissions: {}

# Never cancel a release in flight; a second push to main waits for the first to finish.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  binaries:
    if: ${{ fromJSON(needs.release-please.outputs.releases_created) }}
    needs: [release-please]
    permissions:
      contents: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # all cross-compiled from Linux so nothing links against the Nix dev shell's glibc
          - { target: x86_64-unknown-linux-gnu, runner: ubuntu-latest, builder: zigbuild }
          - { target: aarch64-unknown-linux-gnu, runner: ubuntu-latest, builder: zigbuild }
          # to build the Mac binary natively instead: runner: macos-latest, builder: cargo
          - { target: aarch64-apple-darwin, runner: ubuntu-latest, builder: zigbuild }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/nix-devshell
        with:
          gh-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.3'

      - name: Build
        run: just release-build "${TARGET}" "${BUILDER}"
        env:
          TARGET: ${{ matrix.target }}
          BUILDER: ${{ matrix.builder }}

      - name: Sign and upload
        run: |
          f="dist/smolbento-${TARGET}.tar.gz"
          cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          gh release upload "$TAG" "$f" "$f.sigstore.json"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          TARGET: ${{ matrix.target }}

  # Ask pelotech/homebrew-tap to bump the smolbento formula. Its bump workflow verifies these signed
  # tarballs and opens an auto-merge PR; its daily schedule catches up if this job fails.
  homebrew:
    if: ${{ fromJSON(needs.release-please.outputs.releases_created) }}
    needs: [release-please, binaries]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app
        with:
          app-id: ${{ vars.ORG_RELEASE_PLEASE_CLIENT_ID }}
          private-key: ${{ secrets.ORG_RELEASE_PLEASE_PRIVATE_KEY }}
          owner: pelotech
          repositories: homebrew-tap
          permission-contents: write
      - name: Dispatch formula bump
        run: >-
          gh api repos/pelotech/homebrew-tap/dispatches -f event_type=bump-formula
          -f "client_payload[formula]=smolbento" -f "client_payload[version]=${TAG#v}"
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
