name: Release Please
on:
  push:
    branches:
      - main

permissions: {}

# Never cancel a release in flight; a second push to main waits for the first to finish.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    # Per package: the root crate (smolbento) and kits/nix release separately.
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      nix_kit_created: ${{ steps.release.outputs['kits/nix--release_created'] }}
      nix_kit_version: ${{ steps.release.outputs['kits/nix--version'] }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  binaries:
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    needs: [release-please]
    permissions:
      contents: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # all cross-compiled from Linux so nothing links against the Nix dev shell's glibc
          - { target: x86_64-unknown-linux-gnu, runner: ubuntu-latest, builder: zigbuild }
          - { target: aarch64-unknown-linux-gnu, runner: ubuntu-latest, builder: zigbuild }
          # to build the Mac binary natively instead: runner: macos-latest, builder: cargo
          - { target: aarch64-apple-darwin, runner: ubuntu-latest, builder: zigbuild }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/nix-devshell
        with:
          gh-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: 'v3.1.4'

      - name: Build
        run: just release-build "${TARGET}" "${BUILDER}"
        env:
          TARGET: ${{ matrix.target }}
          BUILDER: ${{ matrix.builder }}

      - name: Sign and upload
        run: |
          f="dist/smolbento-${TARGET}.tar.gz"
          cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          gh release upload "$TAG" "$f" "$f.sigstore.json"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          TARGET: ${{ matrix.target }}

  # Ask pelotech/homebrew-tap to bump the smolbento formula. Its bump workflow verifies these signed
  # tarballs and opens an auto-merge PR; its daily schedule catches up if this job fails.
  homebrew:
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    needs: [release-please, binaries]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        with:
          app-id: ${{ vars.ORG_RELEASE_PLEASE_CLIENT_ID }}
          private-key: ${{ secrets.ORG_RELEASE_PLEASE_PRIVATE_KEY }}
          owner: pelotech
          repositories: homebrew-tap
          permission-contents: write
      - name: Dispatch formula bump
        run: >-
          gh api repos/pelotech/homebrew-tap/dispatches -f event_type=bump-formula
          -f "client_payload[formula]=smolbento" -f "client_payload[version]=${TAG#v}"
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}

  # The nix kit, built with Buildx as sbx documents for v3 kits, then signed by smolbento.
  nix-kit:
    if: ${{ needs.release-please.outputs.nix_kit_created == 'true' }}
    needs: [release-please]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      IMAGE: ghcr.io/pelotech/smolbento/kits/nix
      VERSION: ${{ needs.release-please.outputs.nix_kit_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: docker-container

      # A published version is never pushed again, so its digest and signature don't change.
      - name: Build and push
        id: push
        run: |
          if docker buildx imagetools inspect "$IMAGE:$VERSION" >/dev/null 2>&1; then
            echo "$IMAGE:$VERSION is already published"
            exit 0
          fi
          docker buildx build -f kits/nix/nix.yaml kits/nix \
            --platform linux/amd64,linux/arm64 --push \
            -t "$IMAGE:$VERSION" -t "$IMAGE:latest" --metadata-file meta.json
          echo "digest=$(jq -r '."containerimage.digest"' meta.json)" >> "$GITHUB_OUTPUT"

      - uses: $/.github/actions/nix-devshell
        if: ${{ steps.push.outputs.digest != '' }}
        with:
          gh-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Sign
        if: ${{ steps.push.outputs.digest != '' }}
        run: |
          just build
          ./target/debug/smolbento kit sign "$IMAGE@$DIGEST"
        env:
          DIGEST: ${{ steps.push.outputs.digest }}

  # A sandbox from the published kit, with signatures required and the default trusted signers.
  nix-kit-verify:
    needs: [release-please, nix-kit]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    env:
      SMOLVM_VERSION: "1.35.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/nix-devshell
        with:
          gh-token: ${{ secrets.GITHUB_TOKEN }}
      # Until an org admin makes the package public, pulls need a login.
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable KVM for the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install smolvm
        run: |
          base="https://github.com/smol-machines/smolvm/releases/download/v${SMOLVM_VERSION}"
          tarball="smolvm-${SMOLVM_VERSION}-linux-x86_64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -fsSLO "$base/$tarball"
          curl -fsSL "$base/checksums.sha256" | grep " ${tarball}\$" | sha256sum -c -
          tar xzf "$tarball"
          echo "$RUNNER_TEMP/smolvm-${SMOLVM_VERSION}-linux-x86_64" >> "$GITHUB_PATH" # zizmor: ignore[github-env]

      - name: Create a sandbox with the published kit
        run: |
          just build
          sbt=./target/debug/smolbento
          "$sbt" policy init balanced
          "$sbt" create shell --kit nix --name verify
          "$sbt" exec verify nix --version
          "$sbt" rm -f verify
        env:
          SMOLBENTO_KIT_REQUIRE_SIGNATURE: "true"
