name: Release Please
on:
  push:
    branches:
      - main

permissions: {}

# Never cancel a release in flight; a second push to main waits for the first to finish.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    # Per package: the root crate (smolbento) and kits/nix release separately.
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      nix_kit_created: ${{ steps.release.outputs['kits/nix--release_created'] }}
      nix_kit_version: ${{ steps.release.outputs['kits/nix--version'] }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  binaries:
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    needs: [release-please]
    permissions:
      contents: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # all cross-compiled from Linux so nothing links against the Nix dev shell's glibc
          - { target: x86_64-unknown-linux-gnu, runner: ubuntu-latest, builder: zigbuild }
          - { target: aarch64-unknown-linux-gnu, runner: ubuntu-latest, builder: zigbuild }
          # to build the Mac binary natively instead: runner: macos-latest, builder: cargo
          - { target: aarch64-apple-darwin, runner: ubuntu-latest, builder: zigbuild }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/nix-devshell
        with:
          gh-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: 'v3.1.4'

      - name: Build
        run: just release-build "${TARGET}" "${BUILDER}"
        env:
          TARGET: ${{ matrix.target }}
          BUILDER: ${{ matrix.builder }}

      - name: Sign and upload
        run: |
          f="dist/smolbento-${TARGET}.tar.gz"
          cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          gh release upload "$TAG" "$f" "$f.sigstore.json"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          TARGET: ${{ matrix.target }}

  # Ask pelotech/homebrew-tap to bump the smolbento formula. Its bump workflow verifies these signed
  # tarballs and opens an auto-merge PR; its daily schedule catches up if this job fails.
  homebrew:
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    needs: [release-please, binaries]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        with:
          app-id: ${{ vars.ORG_RELEASE_PLEASE_CLIENT_ID }}
          private-key: ${{ secrets.ORG_RELEASE_PLEASE_PRIVATE_KEY }}
          owner: pelotech
          repositories: homebrew-tap
          permission-contents: write
      - name: Dispatch formula bump
        run: >-
          gh api repos/pelotech/homebrew-tap/dispatches -f event_type=bump-formula
          -f "client_payload[formula]=smolbento" -f "client_payload[version]=${TAG#v}"
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}

  # The nix kit, built with Buildx as sbx documents for v3 kits, then signed by smolbento.
  nix-kit:
    # After the binaries when smolbento releases in the same push (it signs with that release's
    # binary); a kit-only release skips them and runs at once.
    if: >-
      ${{ !cancelled() && needs.release-please.outputs.nix_kit_created == 'true'
      && needs.binaries.result != 'failure' }}
    needs: [release-please, binaries]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # mark the newest smolbento release as GitHub's "Latest" again
      packages: write
      id-token: write
    env:
      IMAGE: ghcr.io/pelotech/smolbento/kits/nix
      VERSION: ${{ needs.release-please.outputs.nix_kit_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: docker-container

      # A published version is never pushed again, so its digest and signature don't change.
      - name: Build and push
        id: push
        run: |
          if docker buildx imagetools inspect "$IMAGE:$VERSION" >/dev/null 2>&1; then
            echo "$IMAGE:$VERSION is already published"
            exit 0
          fi
          docker buildx build -f kits/nix/nix.yaml kits/nix \
            --platform linux/amd64,linux/arm64 --push \
            -t "$IMAGE:$VERSION" -t "$IMAGE:latest" --metadata-file meta.json
          echo "digest=$(jq -r '."containerimage.digest"' meta.json)" >> "$GITHUB_OUTPUT"

      # Signed with the released smolbento users run (0.26.0 has the alias and default signers).
      - uses: $/.github/actions/smolbento-release
        if: ${{ steps.push.outputs.digest != '' }}
        with:
          minimum: "0.26.0"
      - name: Sign
        if: ${{ steps.push.outputs.digest != '' }}
        run: sbt kit sign "$IMAGE@$DIGEST"
        env:
          DIGEST: ${{ steps.push.outputs.digest }}

      # release-please marks every new release "Latest", kits included; that badge belongs to
      # smolbento's newest release, which has the binaries.
      - name: Keep smolbento's release as Latest
        run: |
          tag=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases \
            --limit 50 --json tagName --jq '[.[].tagName | select(startswith("v"))][0]')
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # A sandbox from the published kit, with signatures required and the default trusted signers.
  nix-kit-verify:
    if: ${{ !cancelled() && needs.nix-kit.result == 'success' }}
    needs: [release-please, nix-kit]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/smolbento-release
        with:
          minimum: "0.26.0"
      # Until an org admin makes the package public, pulls need a login.
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: $/.github/actions/smolvm

      - name: Create a sandbox with the published kit
        run: |
          sbt policy init balanced
          sbt create shell --kit nix --name verify
          sbt exec verify nix --version
          sbt rm -f verify
        env:
          SMOLBENTO_KIT_REQUIRE_SIGNATURE: "true"
