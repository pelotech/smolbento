name: e2e
permissions:
  contents: read
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

# A new push to a PR cancels its older run; runs on main queue so every merged commit is checked.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SMOLVM_VERSION: "1.32.3"

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: .github/filters.yaml

  e2e-linux:
    needs: changes
    # Skipped jobs count as passing, so required checks still go green on docs-only PRs.
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/nix-devshell
        with:
          gh-token: ${{ secrets.GITHUB_TOKEN }}
      # Saved from main only: PRs reuse main's cache without crowding it out.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Enable KVM for the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install smolvm
        run: |
          base="https://github.com/smol-machines/smolvm/releases/download/v${SMOLVM_VERSION}"
          tarball="smolvm-${SMOLVM_VERSION}-linux-x86_64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -fsSLO "$base/$tarball"
          curl -fsSL "$base/checksums.sha256" | grep " ${tarball}\$" | sha256sum -c -
          tar xzf "$tarball"
          echo "$RUNNER_TEMP/smolvm-${SMOLVM_VERSION}-linux-x86_64" >> "$GITHUB_PATH" # zizmor: ignore[github-env]

      - name: smolvm version
        run: smolvm --version
      - name: End-to-end tests
        run: just e2e
        env:
          NEXTEST_PROFILE: ci
