name: e2e
permissions:
  contents: read
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

# A new push to a PR cancels its older run; runs on main queue so every merged commit is checked.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: .github/filters.yaml

  e2e-linux:
    needs: changes
    # Skipped jobs count as passing, so required checks still go green on docs-only PRs.
    # Off while proving the buildx repro below (temporary).
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Three runners, each with its own 4 vCPUs: about half the time of one. More barely helps,
    # as the two longest tests take about 100s each.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    name: e2e-linux (${{ matrix.shard }}/3)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/nix-devshell
      # Saved from main only, by one shard: PRs reuse main's cache without crowding it out.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.shard == 1 }}

      - uses: $/.github/actions/kvm

      # Two at a time: four on ubuntu-latest's 4 vCPUs tripled the summed test time (nested VMs,
      # and registry tests boot two each) and took longer overall.
      - name: End-to-end tests
        run: just e2e 2 --partition "slice:${SHARD}/3"
        env:
          NEXTEST_PROFILE: ci
          SHARD: ${{ matrix.shard }}

  # Temporary: the smolvm-only buildx repro on 1.35.4, image seeds off, with SMOLVM_DATA_DIR set to
  # a dir under $HOME, another under /tmp, and smolvm's own default path given explicitly.
  buildx-repro:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { smolvm: "1.35.4", data: "/home/runner/smolvm-data" }
          - { smolvm: "1.35.4", data: "/tmp/smolvm-data" }
          - { smolvm: "1.35.4", data: "/home/runner/.local/share/smolvm" }
    name: buildx-repro (smolvm ${{ matrix.smolvm }} data ${{ matrix.data || 'default' }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/kvm
      - name: Download smolvm
        run: |
          mkdir -p "$RUNNER_TEMP/smolvm"
          curl -fsSL "https://github.com/smol-machines/smolvm/releases/download/v${V}/smolvm-${V}-linux-x86_64.tar.gz" \
            | tar xz -C "$RUNNER_TEMP/smolvm"
          find "$RUNNER_TEMP/smolvm" -maxdepth 3 -name smolvm -type f | head -1 > "$RUNNER_TEMP/smolvm-path"
          cat "$RUNNER_TEMP/smolvm-path"
        env:
          V: ${{ matrix.smolvm }}
      - name: Repro
        run: |
          [ -z "$DATA" ] || export SMOLVM_DATA_DIR="$DATA"
          SMOLVM="$(cat "$RUNNER_TEMP/smolvm-path")" SMOLVM_IMAGE_SEEDS=0 RUNS=3 sh tests/repro/buildx-repro.sh
        env:
          DATA: ${{ matrix.data }}

  # Temporary: the seeds-off repro again after the nix dev shell and Rust cache setup, where it hung
  # 3 of 3 once.
  builder-alone:
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      E2E_DIR: /tmp/sbt-e2e-1001
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/nix-devshell
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: false
      - uses: $/.github/actions/kvm
      - name: Download smolvm 1.35.4
        run: |
          mkdir -p "$RUNNER_TEMP/smolvm"
          curl -fsSL https://github.com/smol-machines/smolvm/releases/download/v1.35.4/smolvm-1.35.4-linux-x86_64.tar.gz \
            | tar xz -C "$RUNNER_TEMP/smolvm"
          find "$RUNNER_TEMP/smolvm" -maxdepth 3 -name smolvm -type f | head -1 > "$RUNNER_TEMP/smolvm-path"
          id -u
      - name: Repro, image seeds off
        run: >-
          SMOLVM="$(cat "$RUNNER_TEMP/smolvm-path")" SMOLVM_DATA_DIR="$E2E_DIR" SMOLVM_IMAGE_SEEDS=0
          RUNS=3 sh tests/repro/buildx-repro.sh
      - name: smolbento by hand, image seeds off
        if: false
        run: |
          cargo build --locked
          SMOLVM_IMAGE_SEEDS=0 BENTO=target/debug/smolbento SMOLVM_HOME="$E2E_DIR" sh tests/repro/bento-builder.sh
      - name: smolbento by hand, image seeds on (control)
        if: false
        run: BENTO=target/debug/smolbento SMOLVM_HOME="$E2E_DIR" sh tests/repro/bento-builder.sh
