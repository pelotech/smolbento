name: e2e
permissions:
  contents: read
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

env:
  SMOLVM_VERSION: "1.32.3"

jobs:
  e2e-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/nix-devshell
        with:
          gh-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable KVM for the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install smolvm
        run: |
          base="https://github.com/smol-machines/smolvm/releases/download/v${SMOLVM_VERSION}"
          tarball="smolvm-${SMOLVM_VERSION}-linux-x86_64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -fsSLO "$base/$tarball"
          curl -fsSL "$base/checksums.sha256" | grep " ${tarball}\$" | sha256sum -c -
          tar xzf "$tarball"
          echo "$RUNNER_TEMP/smolvm-${SMOLVM_VERSION}-linux-x86_64" >> "$GITHUB_PATH" # zizmor: ignore[github-env]

      - name: smolvm version
        run: smolvm --version
      - name: End-to-end tests
        run: just e2e
