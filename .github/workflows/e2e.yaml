name: e2e
permissions:
  contents: read
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

# A new push to a PR cancels its older run; runs on main queue so every merged commit is checked.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: .github/filters.yaml

  e2e-linux:
    needs: changes
    # Skipped jobs count as passing, so required checks still go green on docs-only PRs.
    # Off while proving the buildx repro below (temporary).
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Three runners, each with its own 4 vCPUs: about half the time of one. More barely helps,
    # as the two longest tests take about 100s each.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    name: e2e-linux (${{ matrix.shard }}/3)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/nix-devshell
      # Saved from main only, by one shard: PRs reuse main's cache without crowding it out.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.shard == 1 }}

      - uses: $/.github/actions/kvm

      # Two at a time: four on ubuntu-latest's 4 vCPUs tripled the summed test time (nested VMs,
      # and registry tests boot two each) and took longer overall.
      - name: End-to-end tests
        run: just e2e 2 --partition "slice:${SHARD}/3"
        env:
          NEXTEST_PROFILE: ci
          SHARD: ${{ matrix.shard }}

  # Temporary: the same seeds-off repro in nine identical jobs, each printing its runner's CPU: each
  # job hangs every build or none, whatever the data dir.
  buildx-repro:
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { smolvm: "1.35.4", n: 1 }
          - { smolvm: "1.35.4", n: 2 }
          - { smolvm: "1.35.4", n: 3 }
          - { smolvm: "1.35.4", n: 4 }
          - { smolvm: "1.35.4", n: 5 }
          - { smolvm: "1.35.4", n: 6 }
          - { smolvm: "1.35.4", n: 7 }
          - { smolvm: "1.35.4", n: 8 }
          - { smolvm: "1.35.4", n: 9 }
          - { smolvm: "1.35.4", n: 10 }
          - { smolvm: "1.35.4", n: 11 }
          - { smolvm: "1.35.4", n: 12 }
          - { smolvm: "1.35.3", n: 1 }
          - { smolvm: "1.35.3", n: 2 }
          - { smolvm: "1.35.3", n: 3 }
    name: buildx-repro (smolvm ${{ matrix.smolvm }} #${{ matrix.n }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/kvm
      - name: Download smolvm
        run: |
          mkdir -p "$RUNNER_TEMP/smolvm"
          curl -fsSL "https://github.com/smol-machines/smolvm/releases/download/v${V}/smolvm-${V}-linux-x86_64.tar.gz" \
            | tar xz -C "$RUNNER_TEMP/smolvm"
          find "$RUNNER_TEMP/smolvm" -maxdepth 3 -name smolvm -type f | head -1 > "$RUNNER_TEMP/smolvm-path"
          cat "$RUNNER_TEMP/smolvm-path"
        env:
          V: ${{ matrix.smolvm }}
      - name: Repro
        run: |
          echo "cpu: $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2)"
          echo "kernel: $(uname -r) cores: $(nproc)"
          SMOLVM="$(cat "$RUNNER_TEMP/smolvm-path")" SMOLVM_IMAGE_SEEDS=0 SMOLVM_DATA_DIR=/tmp/sbt-e2e-1001 \
            RUNS=3 sh tests/repro/buildx-repro.sh

  # Temporary: the build-stanza kit test with smolvm's image seeds on, then as e2e runs it (off).
  builder-alone:
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      E2E_DIR: /tmp/sbt-e2e-1001
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/nix-devshell
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: false
      - uses: $/.github/actions/kvm
      - name: Download smolvm 1.35.4
        run: |
          mkdir -p "$RUNNER_TEMP/smolvm"
          curl -fsSL https://github.com/smol-machines/smolvm/releases/download/v1.35.4/smolvm-1.35.4-linux-x86_64.tar.gz \
            | tar xz -C "$RUNNER_TEMP/smolvm"
          find "$RUNNER_TEMP/smolvm" -maxdepth 3 -name smolvm -type f | head -1 > "$RUNNER_TEMP/smolvm-path"
          id -u
      - name: Seeds on (the build-stanza kit, registry and -t as the test)
        run: >-
          cargo nextest run --locked --run-ignored only --no-fail-fast --retries 0
          -E 'binary(e2e) & test(hunt_build_stanza_kit_seeds_on)'
        env:
          NEXTEST_PROFILE: ci
      - name: Delete the builder
        if: always()
        run: SMOLVM_DATA_DIR="$E2E_DIR" "$E2E_DIR/engine/1.35.4/smolvm" machine delete -f -n sbx-_builder || true
      - name: Seeds off (the same test as e2e runs it, control)
        if: always()
        run: >-
          cargo nextest run --locked --run-ignored only --no-fail-fast --retries 0
          -E 'binary(e2e) & test(hunt_build_stanza_kit_alone)'
        env:
          NEXTEST_PROFILE: ci

  # Temporary: the e2e builder test that stalls, on 1.35.3 and 1.35.4 in the same run, five jobs
  # each, so both versions meet the same Docker Hub and runner conditions. Rerun the workflow for
  # more rounds.
  builder-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        smolvm: ["1.35.3", "1.35.4"]
        n: [1, 2, 3, 4, 5]
    name: builder-ab (smolvm ${{ matrix.smolvm }} #${{ matrix.n }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/nix-devshell
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: false
      - uses: $/.github/actions/kvm
      - name: Download smolvm
        run: |
          mkdir -p "$RUNNER_TEMP/smolvm"
          curl -fsSL "https://github.com/smol-machines/smolvm/releases/download/v${V}/smolvm-${V}-linux-x86_64.tar.gz" \
            | tar xz -C "$RUNNER_TEMP/smolvm"
          echo "SMOLBENTO_SMOLVM=$(find "$RUNNER_TEMP/smolvm" -maxdepth 3 -name smolvm -type f | head -1)" >> "$GITHUB_ENV"
        env:
          V: ${{ matrix.smolvm }}
      - name: Build the tests
        run: cargo nextest run --locked --run-ignored only --no-run
      - name: The builder test
        run: |
          echo "start: $(date -u +%H:%M:%SZ) cpu: $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2)"
          "$SMOLBENTO_SMOLVM" --version
          cargo nextest run --locked --run-ignored only --no-fail-fast --retries 0 \
            -E 'binary(e2e) & test(local_v3_kit_builds_in_the_builder_sandbox)'
        env:
          NEXTEST_PROFILE: ci

