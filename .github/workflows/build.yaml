name: build
permissions:
  contents: read
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      macos:
        description: Also run on macOS (macOS minutes are expensive)
        type: boolean
        default: false

# A new push to a PR cancels its older run; runs on main queue so every merged commit is checked.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      build: ${{ steps.filter.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: .github/filters.yaml

  test:
    needs: changes
    # Skipped jobs count as passing, so required checks still go green on docs-only PRs.
    if: ${{ needs.changes.outputs.code == 'true' || github.event_name == 'workflow_dispatch' }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/nix-devshell
      # Saved from main only: PRs reuse main's cache without crowding it out.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # A smolvm version bump (Renovate) fails here until `just smolvm-pin` adds its checksums.
      - name: smolvm.lock matches its release
        if: ${{ matrix.runner == 'ubuntu-latest' }}
        run: just smolvm-lock-check
      # The CLI tests build the binary, so there's no separate build step.
      - name: Test
        run: just test

  # The tests never compile macOS-only code: an unoptimised darwin build in the release container
  # checks it on every code change, in less time than a release build.
  darwin-check:
    needs: changes
    if: ${{ (needs.changes.outputs.code == 'true' && github.event_name == 'pull_request') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/nix-devshell

      - name: Build for aarch64-apple-darwin
        run: just check-target aarch64-apple-darwin

  # The release binaries are cross-compiled in a container. Building them finds a break before a
  # release is tagged (nothing is signed or uploaded), on the release PR and on pull requests that
  # change the build's inputs; darwin-check covers macOS-only code on every other change.
  release-build:
    needs: changes
    if: ${{ (github.event_name == 'pull_request' && (needs.changes.outputs.build == 'true' || startsWith(github.head_ref, 'release-please--'))) || github.event_name == 'workflow_dispatch' }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - aarch64-apple-darwin
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/nix-devshell

      - name: Build
        run: just release-build "${TARGET}" zigbuild
        env:
          TARGET: ${{ matrix.target }}

  test-macos:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.macos }}
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/nix-devshell

      # The CLI tests build the binary, so there's no separate build step.
      - name: Test
        run: just test
