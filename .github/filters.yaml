# Paths that need the Rust build, tests and e2e to run (used by dorny/paths-filter).
# Docs-only changes skip them; pre-commit still lints everything.
code:
  - 'src/**'
  - 'tests/**'
  - 'Cargo.toml'
  - 'Cargo.lock'
  - 'deny.toml'
  - 'flake.nix'
  - 'flake.lock'
  - 'justfile'
  - 'smolvm.lock'
  - '.github/**'
# Inputs of the release build, which runs on pull requests that change them (and on the release PR).
build:
  - 'Cargo.toml'
  - 'Cargo.lock'
  - 'flake.nix'
  - 'flake.lock'
  - 'justfile'
  - '.github/workflows/build.yaml'
  - '.github/actions/nix-devshell/**'
